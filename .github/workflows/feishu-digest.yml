name: Feishu Digest

# 每天把 AI builders 简报推到飞书。
#
# 三步：prepare-digest.js 抓取素材 → remix-api.js 用 Claude 生成中文简报
# → feishu-deliver.js 发成飞书卡片。
#
# 需要两个 repo secret（Settings → Secrets and variables → Actions）：
#   ANTHROPIC_API_KEY   — LLM API key
#   FEISHU_WEBHOOK_URL  — 飞书群自定义机器人 webhook
#
# 中国大陆不在 Anthropic 支持的计费地区内，Console 里没有对应选项。所以这里
# 支持换用其它兼容 Anthropic Messages 格式的服务商，配两个 repo variable
# （Settings → Secrets and variables → Actions → Variables，不是 Secrets）：
#   FB_ANTHROPIC_BASE_URL — 例如 https://api.deepseek.com/anthropic
#   FB_MODEL              — 例如 deepseek-v4-pro
# 两个都留空就走 Anthropic 官方 + claude-opus-5。

on:
  schedule:
    # 目标是北京时间 10:00 收到推送。
    #
    # GitHub 对公开仓库的定时任务会排队，UTC 午夜前后尤其挤。08-15 到 08-26 这
    # 12 天实测，从触发到实际开跑稳定晚 99 到 110 分钟（中位 104）。所以这里把
    # nominal 定在 08:16 BJ（00:16 UTC），加上这段延迟落在 09:55–10:06。
    #
    # 这是拿观测到的延迟倒推的，不是保证 —— GitHub 出故障时会远超这个范围
    # （08-27 那次数据库故障把运行推到了 17:34）。要准点只能改用外部服务调
    # workflow_dispatch，那类触发不降优先级。
    #
    # 上游 generate-feed.yml 在 UTC 06:17 刷新素材，所以这里取到的是前一天的
    # 那批 feed，内容完整。
    - cron: '16 0 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 续期那一步要往 main 推空提交，所以需要写权限。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 公开仓库里，只靠 cron 触发的 workflow 在 60 天没有仓库活动之后会被 GitHub
      # 自动停用，而定时运行本身不算活动。所以快到期时推一个空提交续期。放在最前面
      # 是为了让它不受后面步骤成败的影响 —— 连续失败 60 天同样会让 schedule 失效。
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct HEAD) ) / 86400 ))
          echo "距上次提交 ${days} 天"
          if [ "$days" -lt 45 ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: 保持定时任务有效'
          git push origin HEAD:${{ github.event.repository.default_branch }}

      # 不开 npm cache：cache 只是加快速度，但 lockfile 一有问题整个 job 就挂。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          # 只打印长度和是否有多余空白，绝不打印内容本身。
          fail=0
          for name in ANTHROPIC_API_KEY FEISHU_WEBHOOK_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set — 在 repo Settings → Secrets 里添加"
              fail=1
              continue
            fi
            trimmed="$(printf '%s' "$value" | tr -d '[:space:]')"
            if [ "${#trimmed}" -ne "${#value}" ]; then
              echo "::warning::$name 含有空白字符（长度 ${#value}，去掉空白后 ${#trimmed}）——粘贴时可能多带了换行"
            fi
            echo "$name: ok (length ${#value})"
          done
          exit $fail

      - name: Install dependencies
        run: cd scripts && npm ci

      # prepare-digest.js 任何一个 feed 抓取失败就整体退出，偶发网络抖动会白白
      # 损失一天的简报，所以退避重试三次。
      - name: Prepare digest feed
        run: |
          cd scripts
          for attempt in 1 2 3; do
            if node prepare-digest.js > feed.json && [ -s feed.json ]; then
              echo "prepare ok on attempt $attempt"
              exit 0
            fi
            echo "prepare-digest.js attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "::error::prepare-digest.js failed after 3 attempts"
          exit 1

      - name: Remix into Chinese digest
        id: remix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_TIMEZONE: Asia/Shanghai
          # 空值时 remix-api.js 用自己的默认值（Anthropic 官方 + claude-opus-5）。
          FB_ANTHROPIC_BASE_URL: ${{ vars.FB_ANTHROPIC_BASE_URL }}
          FB_MODEL: ${{ vars.FB_MODEL }}
        run: |
          cd scripts
          # 限流、502、连接中断都是一次性故障，重试就能过。退避拉长一些，因为
          # 限流窗口通常是分钟级的。退出码 2 表示今天没内容，不该重试。
          for attempt in 1 2 3; do
            set +e
            node remix-api.js --file feed.json > digest.md
            rc=$?
            set -e
            if [ "$rc" = "0" ] && [ -s digest.md ]; then
              echo "remix ok on attempt $attempt — digest: $(wc -c < digest.md) bytes"
              exit 0
            fi
            if [ "$rc" = "2" ]; then
              # 今天追踪的 builder 没有新内容，不发空简报。
              echo "no-content=true" >> "$GITHUB_OUTPUT"
              echo "feed 里没有内容，跳过推送"
              exit 0
            fi
            echo "::warning::remix-api.js attempt $attempt exited $rc"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 45))
          done
          echo "::error::remix-api.js failed after 3 attempts"
          exit 1

      - name: Deliver to Feishu
        if: steps.remix.outputs.no-content != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          cd scripts
          for attempt in 1 2 3; do
            if node feishu-deliver.js --file digest.md; then
              exit 0
            fi
            echo "::warning::feishu-deliver.js attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::error::feishu-deliver.js failed after 3 attempts"
          exit 1

      # 推送失败时把生成好的简报留下来，免得重跑一次又要付一次 API 费用。
      - name: Upload digest on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            scripts/digest.md
            scripts/feed.json
          retention-days: 7
          if-no-files-found: ignore
